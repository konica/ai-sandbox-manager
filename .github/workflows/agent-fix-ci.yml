name: agent-fix-ci

on:
  workflow_run:
    # PORTABILITY: workflow_run cannot take an expression, so this name is
    # literal. Keep it in sync with `ciWorkflow` in .github/agent-burn.json —
    # scripts/burn/setup.mjs checks this and reports drift.
    workflows: ["build-check"]
    types: [completed]
  pull_request:
    types: [closed]

concurrency:
  group: agent-fix-ci-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Green CI: promote the draft so it enters the human review queue, at which
  # point the existing code-review workflow fires on `ready_for_review`.
  #
  # SECURITY: workflow_run always runs in the base repo's context with full
  # secrets access, even when the run that triggered it came from a fork PR.
  # startsWith(head_branch, 'agent/') alone is not an origin check — a fork PR
  # author picks their own branch name. head_repository.full_name == repository
  # is the actual gate that keeps this off fork-authored branches.
  promote:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'agent/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Mark the pull request ready for review
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # `--head` matches on branch NAME alone, so it also returns pull
          # requests opened from forks — a branch name is not an identity. The
          # job `if:` gate above only proves the CI *run* came from this repo;
          # this filter is what keeps the lookup itself on our own head refs.
          NUM=$(gh pr list --head "$BRANCH" --state open \
            --json number,isDraft,headRepositoryOwner,headRepository \
            --jq '.[] | select(.isDraft and .headRepositoryOwner.login == env.REPO_OWNER and .headRepository.name == env.REPO_NAME) | .number' \
            | head -1)
          if [ -z "$NUM" ]; then
            echo "No draft pull request on $BRANCH; nothing to promote."
            exit 0
          fi
          gh pr ready "$NUM"
          echo "Promoted #$NUM to ready for review."

  # Red CI: retry up to maxCiRetries, then hand over.
  #
  # SECURITY: same origin gate as `promote`, above — required here as well
  # since this job also runs on workflow_run with full secrets access.
  #
  # KILL SWITCH: this is the job that spends money and mutates code — it runs a
  # full claude-code-action pass and pushes commits — so it is the one
  # AGENT_BURN_ENABLED must stop. `promote` and `unclaim`, below, are
  # deliberately left ungated: promote only flips a draft PR to ready-for-review
  # and unclaim only removes a label and deletes a branch after a human closes a
  # PR, so neither spends anything or runs an agent, and gating `unclaim` would
  # strand claims on tickets for the duration of a pause instead of cleaning up
  # after them.
  retry:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'agent/') &&
      vars.AGENT_BURN_ENABLED != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PAT }}
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Read config and current retry count
        id: state
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          NEEDS_HUMAN=$(node -e "import('./scripts/burn/config.mjs').then(async (m) => {
            const fs = await import('node:fs/promises')
            let raw = {}
            try { raw = JSON.parse(await fs.readFile('.github/agent-burn.json', 'utf8')) } catch {}
            const c = m.loadConfig(raw)
            const out = ['maxCiRetries=' + c.maxCiRetries, 'needsHumanLabel=' + c.needsHumanLabel]
            await fs.appendFile(process.env.GITHUB_OUTPUT, out.join('\n') + '\n')
            process.stdout.write(c.needsHumanLabel)
          })")
          # `--head` matches on branch NAME alone, so it also returns fork pull
          # requests, and gh returns newest first — a stranger's fork branch
          # would otherwise win this lookup and drive the handover below onto
          # whatever issue their pull request body names.
          PR=$(gh pr list --head "$BRANCH" --state open \
            --json number,headRepositoryOwner,headRepository \
            --jq '[.[] | select(.headRepositoryOwner.login == env.REPO_OWNER and .headRepository.name == env.REPO_NAME)][0].number')
          # On every bail-out path, blank `pr` is what disables the three steps
          # below. `attempts` is set alongside it purely so the fromJSON() in
          # their `if:` never sees an empty string, whatever the expression
          # evaluator decides to do about short-circuiting.
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No open pull request on $BRANCH; nothing to retry."
            printf 'pr=\nattempts=0\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Already handed over: every later red build would otherwise re-enter
          # this job, re-add the label, and post another duplicate comment.
          if gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qxF "$NEEDS_HUMAN"; then
            echo "Pull request #$PR already carries \"$NEEDS_HUMAN\"; a human owns it now."
            printf 'pr=\nattempts=0\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          # The retry counter lives in labels: visible, resettable by hand, and
          # durable across workflow re-runs.
          N=$(gh pr view "$PR" --json labels --jq '[.labels[].name | capture("^agent-retry-(?<n>[0-9]+)$") | .n | tonumber] | max // 0')
          echo "attempts=$N" >> "$GITHUB_OUTPUT"
          echo "issue=$(gh pr view "$PR" --json body --jq '.body | capture("[Cc]loses #(?<n>[0-9]+)") | .n')" >> "$GITHUB_OUTPUT"

      - name: Hand over to a human
        # Step outputs are always strings, and GitHub Actions only coerces to
        # number when the compared types differ — with two strings it falls
        # back to a lexicographic compare ('9' >= '10' is true). fromJSON()
        # forces both sides to numbers so the threshold compares correctly
        # once maxCiRetries is multi-digit.
        if: steps.state.outputs.pr != '' && fromJSON(steps.state.outputs.attempts) >= fromJSON(steps.state.outputs.maxCiRetries)
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          PR: ${{ steps.state.outputs.pr }}
          ISSUE: ${{ steps.state.outputs.issue }}
          ATTEMPTS: ${{ steps.state.outputs.attempts }}
          NEEDS_HUMAN: ${{ steps.state.outputs.needsHumanLabel }}
        run: |
          gh pr edit "$PR" --add-label "$NEEDS_HUMAN"
          gh pr comment "$PR" --body \
            "CI is still failing after $ATTEMPTS automated fix attempt(s). Handing over. Failing run: $RUN_URL"
          if [ -n "$ISSUE" ]; then
            # Keep the wip label: releasing it here would let the dispatcher
            # start a second agent on work that already has an open PR.
            gh issue edit "$ISSUE" --add-label "$NEEDS_HUMAN"
          fi

      - name: Record the attempt
        # See the numeric-comparison note on "Hand over to a human", above.
        if: steps.state.outputs.pr != '' && fromJSON(steps.state.outputs.attempts) < fromJSON(steps.state.outputs.maxCiRetries)
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          PR: ${{ steps.state.outputs.pr }}
          ATTEMPTS: ${{ steps.state.outputs.attempts }}
        run: |
          NEXT=$(( ATTEMPTS + 1 ))
          gh pr edit "$PR" --add-label "agent-retry-$NEXT"
          echo "NEXT=$NEXT" >> "$GITHUB_ENV"

      - name: Fix the failure
        # See the numeric-comparison note on "Hand over to a human", above.
        if: steps.state.outputs.pr != '' && fromJSON(steps.state.outputs.attempts) < fromJSON(steps.state.outputs.maxCiRetries)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_PAT }}
          prompt: |
            CI failed on pull request #${{ steps.state.outputs.pr }}, branch
            `${{ github.event.workflow_run.head_branch }}`. This is automated fix
            attempt ${{ env.NEXT }} of ${{ steps.state.outputs.maxCiRetries }}.

            Read the failing job logs for run
            ${{ github.event.workflow_run.html_url }} using
            `gh run view ${{ github.event.workflow_run.id }} --log-failed`.

            Diagnose the actual root cause and fix it. Do not delete, skip, or
            weaken tests to make CI pass — if a test is genuinely wrong, say so
            in a pull request comment and explain why before changing it.

            Commit and push to the same branch. Do not open a new pull request
            and do not merge.

  # Pull request closed without merging: release the claim so the ticket returns
  # to the frontier, and delete the branch.
  #
  # SECURITY: unlike promote/retry above, this job does not need an equivalent
  # head_repository origin check. It triggers on `pull_request` (not
  # `pull_request_target`), and for `pull_request` runs from a forked
  # repository GitHub withholds all secrets except the default GITHUB_TOKEN,
  # and downgrades that token to read-only. secrets.AGENT_PAT below therefore
  # resolves empty on a fork PR, so every mutating `gh`/`git push` call in this
  # job fails closed (already guarded by `|| true`) rather than succeeding
  # with attacker-influenced input.
  unclaim:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == false &&
      startsWith(github.event.pull_request.head.ref, 'agent/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Without an explicit ref, checkout resolves github.sha — for a
          # `pull_request` event that is the MERGE commit, which GitHub does not
          # compute for a pull request that conflicts with its base. With two
          # agents branching from main at once, conflicting agent pull requests
          # are routine; closing one would then die here, before releasing
          # anything, and nothing else in the system ever removes the wip label.
          # This job only needs scripts/burn/config.mjs from the base repo, and
          # the base commit always exists.
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Release the claim
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          WIP=$(node -e "import('./scripts/burn/config.mjs').then(async (m) => {
            const fs = await import('node:fs/promises')
            let raw = {}
            try { raw = JSON.parse(await fs.readFile('.github/agent-burn.json', 'utf8')) } catch {}
            process.stdout.write(m.loadConfig(raw).wipLabel)
          })")
          ISSUE=$(printf '%s' "$BODY" | grep -oiE 'closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --remove-label "$WIP" || true
            echo "Released $WIP on #$ISSUE."
          fi
          git push origin --delete "$BRANCH" || true
