name: agent-burn

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the frontier without dispatching any agent
        type: boolean
        default: false
  issues:
    types: [labeled]
  pull_request:
    types: [closed]
  schedule:
    # Catch-up net for missed or failed events.
    - cron: '17 */6 * * *'

# One dispatcher run at a time. This is what makes claiming race-free without a
# distributed lock; queued runs recompute the frontier from fresh state.
concurrency:
  group: agent-burn
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  plan:
    # Kill switch: unset means enabled, so a fresh copy of these files works
    # without any repository variable being configured.
    #
    # The fork clause is not a security gate — `plan` reads nothing from the
    # event payload. A `pull_request` run from a fork gets no secrets, so
    # AGENT_PAT is empty and "Require AGENT_PAT" would fail with a message that
    # is actively misleading in that context. A red agent-burn run on every
    # external pull request close teaches people to ignore this workflow being
    # red, which is worse than the missed replan: a fork merge still replans on
    # the next scheduled run.
    #
    # The label clause guards against self-triggering: `burn` claims a ticket
    # with `AGENT_PAT` rather than `GITHUB_TOKEN` (see the note on that job),
    # so adding agent-wip itself fires an `issues: labeled` event, and
    # agent-fix-ci.yml adding needs-human does the same. Without this, every
    # dispatch spawned a spurious redundant run that queued on the
    # `concurrency: agent-burn` group and cancelled the run(s) ahead of it.
    # Job `if:` is evaluated before any step runs — before checkout, before
    # config can be read — so 'ready-for-agent' is a literal here, same
    # constraint as the two literals in agent-fix-ci.yml. `setup.mjs` flags
    # drift against `config.readyLabel`.
    if: >-
      vars.AGENT_BURN_ENABLED != 'false' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'issues' ||
       github.event.label.name == 'ready-for-agent')
    runs-on: ubuntu-latest
    outputs:
      frontier: ${{ steps.frontier.outputs.frontier }}
      count: ${{ steps.frontier.outputs.count }}
      stalled: ${{ steps.frontier.outputs.stalled }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On a `pull_request` event with no explicit ref, checkout resolves
          # github.sha — the merge commit, which GitHub never computes for a
          # pull request that conflicts with its base. Closing a conflicted
          # agent pull request would then red the dispatcher before it replans.
          # The base commit always exists. Empty on every other event means
          # "the default ref", which is what checkout does without this input.
          ref: ${{ github.event.pull_request.base.sha || '' }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # PRs opened with GITHUB_TOKEN do not trigger other workflows, so CI and
      # review would never run and the queue would stall silently. Fail loudly
      # at minute zero instead.
      - name: Require AGENT_PAT
        env:
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: |
          if [ -z "$AGENT_PAT" ]; then
            echo "::error::AGENT_PAT secret is missing. Pull requests opened with GITHUB_TOKEN do not trigger CI or review workflows, so the queue would stall silently. Create a fine-grained PAT with Contents, Pull requests, and Issues read+write and store it as AGENT_PAT."
            exit 1
          fi

      - name: Compute the ready frontier
        id: frontier
        env:
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/burn/ready.mjs > /dev/null

      - name: Summarise
        if: always()
        env:
          FRONTIER: ${{ steps.frontier.outputs.frontier }}
          STALLED: ${{ steps.frontier.outputs.stalled }}
        run: |
          NEEDS_HUMAN=$(node -e "import('./scripts/burn/config.mjs').then(async (m) => {
            const fs = await import('node:fs/promises')
            let raw = {}
            try { raw = JSON.parse(await fs.readFile('.github/agent-burn.json', 'utf8')) } catch {}
            process.stdout.write(m.loadConfig(raw).needsHumanLabel)
          })")
          {
            echo "### agent-burn frontier"
            if [ "$STALLED" = "true" ]; then
              echo "> **Blocked on you.** Every concurrency slot is held by a ticket labelled $NEEDS_HUMAN. An empty frontier below means frozen, not finished — see the step log."
            fi
            echo '```json'
            echo "${FRONTIER:-[]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  burn:
    needs: plan
    if: >-
      needs.plan.outputs.count != '' &&
      needs.plan.outputs.count != '0' &&
      inputs.dry_run != true
    runs-on: ubuntu-latest
    # max-parallel is deliberately unset: ready.mjs already caps the frontier at
    # the available slots, so the bound is enforced upstream where it is tested.
    strategy:
      fail-fast: false
      matrix:
        ticket: ${{ fromJSON(needs.plan.outputs.frontier) }}
    # Every privileged call in this job authorizes with secrets.AGENT_PAT, not
    # GITHUB_TOKEN: checkout takes it explicitly, the agent action takes it as
    # github_token, and so the git remote it pushes through carries it. So
    # GITHUB_TOKEN needs no write scope at all — granting it any would only
    # blur the one rule this workflow rests on, that AGENT_PAT authorizes and
    # GITHUB_TOKEN does not. id-token and actions are for the agent action
    # itself (OIDC, and reading workflow run logs).
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PAT }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Claim the ticket
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          ISSUE: ${{ matrix.ticket.number }}
        run: |
          # Exports WIP_LABEL and NEEDS_HUMAN_LABEL for the later steps, and
          # echoes the wip label for this one — GITHUB_ENV only lands on the
          # steps that follow.
          WIP=$(node -e "import('./scripts/burn/config.mjs').then(async (m) => {
            const fs = await import('node:fs/promises')
            let raw = {}
            try { raw = JSON.parse(await fs.readFile('.github/agent-burn.json', 'utf8')) } catch {}
            const c = m.loadConfig(raw)
            await fs.appendFile(process.env.GITHUB_ENV,
              'WIP_LABEL=' + c.wipLabel + '\nNEEDS_HUMAN_LABEL=' + c.needsHumanLabel + '\n')
            process.stdout.write(c.wipLabel)
          })")
          gh issue edit "$ISSUE" --add-label "$WIP"

      - name: Create the working branch
        env:
          BRANCH: ${{ matrix.ticket.branch }}
        run: |
          git config user.name  "agent-burn[bot]"
          git config user.email "agent-burn@users.noreply.github.com"
          git checkout -b "$BRANCH"

      - name: Render the prompt
        id: prompt
        env:
          ISSUE: ${{ matrix.ticket.number }}
          BRANCH: ${{ matrix.ticket.branch }}
        run: |
          VERIFY=$(node -e "import('./scripts/burn/config.mjs').then(async (m) => {
            const fs = await import('node:fs/promises')
            let raw = {}
            try { raw = JSON.parse(await fs.readFile('.github/agent-burn.json', 'utf8')) } catch {}
            process.stdout.write(m.loadConfig(raw).verifyCommands.map((c) => '   - \`' + c + '\`').join('\n'))
          })")
          {
            echo 'prompt<<PROMPT_EOF'
            sed -e "s|{{ISSUE_NUMBER}}|$ISSUE|g" \
                -e "s|{{BRANCH}}|$BRANCH|g" \
                .github/agent-burn-prompt.md \
              | awk -v v="$VERIFY" '{ if ($0 == "{{VERIFY_COMMANDS}}") print v; else print }'
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run the agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_PAT }}
          prompt: ${{ steps.prompt.outputs.prompt }}

      # `Closes #N` is mandated only by a prompt rule, yet three later paths read
      # it: promotion, the CI-retry handover, and the unclaim on a closed pull
      # request. Without it a merge does not close the issue, the wip label
      # outlives the work, and the ticket is skipped as claimed forever. Fail
      # here so a human sees it now — do not try to repair the body.
      - name: Verify the pull request closes the ticket
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          BRANCH: ${{ matrix.ticket.branch }}
          ISSUE: ${{ matrix.ticket.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Same-repo only: `--head` matches on branch name, which a fork shares.
          PR=$(gh pr list --head "$BRANCH" --state open \
            --json number,headRepositoryOwner,headRepository \
            --jq '[.[] | select(.headRepositoryOwner.login == env.REPO_OWNER and .headRepository.name == env.REPO_NAME)][0].number // empty')
          if [ -z "$PR" ]; then
            echo "No pull request on $BRANCH; the release step handles the claim."
            exit 0
          fi
          BODY=$(gh pr view "$PR" --json body --jq '.body // ""')
          if ! printf '%s\n' "$BODY" | grep -qiE "closes #${ISSUE}([^0-9]|\$)"; then
            echo "::error::Pull request #${PR} on $BRANCH does not contain 'Closes #${ISSUE}'. Merging it would not close the ticket, so the claim label would never be released and the ticket would be skipped as claimed forever. Fix the pull request body by hand."
            exit 1
          fi
          echo "Pull request #${PR} closes #${ISSUE}."

      # A run that dies before opening a PR must release its claim, or the
      # ticket is stranded until a human notices.
      - name: Release the claim if no pull request was opened
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          BRANCH: ${{ matrix.ticket.branch }}
          ISSUE: ${{ matrix.ticket.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # `gh pr list --head` filters on branch NAME, which also matches pull
          # requests opened from forks — anyone can create `agent/12-x` in their
          # own fork. Restrict to this repository's own head refs.
          COUNT=$(gh pr list --head "$BRANCH" --state open \
            --json number,headRepositoryOwner,headRepository \
            --jq '[.[] | select(.headRepositoryOwner.login == env.REPO_OWNER and .headRepository.name == env.REPO_NAME)] | length')
          if [ -n "$WIP_LABEL" ] && [ "$COUNT" = "0" ]; then
            echo "No pull request on $BRANCH; unclaiming #$ISSUE."
            # Removing the claim alone would put the ticket straight back on the
            # frontier, and the cron would burn a full agent run on it every six
            # hours forever. The prompt tells the agent to open no pull request
            # when a ticket cannot be implemented as written, so reaching here
            # usually means a human has to look. CI retries are bounded; this is
            # what bounds dispatch attempts.
            gh issue edit "$ISSUE" \
              --remove-label "$WIP_LABEL" \
              --add-label "$NEEDS_HUMAN_LABEL"
          fi
