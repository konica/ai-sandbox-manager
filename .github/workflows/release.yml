name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            builder_args: --mac --arm64
            smoke: gui
          - os: macos-13
            builder_args: --mac --x64
            smoke: gui
          - os: windows-latest
            builder_args: --win --x64
            smoke: gui
          - os: ubuntu-latest
            builder_args: --linux --x64
            smoke: xvfb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Assert tag matches package.json version
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          [ "$PKG" = "$TAG" ] || { echo "tag $TAG != package.json $PKG"; exit 1; }
      # A transitive dep (@electron/node-gyp via electron-builder) is a GitHub git
      # dependency; force HTTPS so a runner with no SSH key can fetch it.
      - name: Prefer HTTPS for GitHub git dependencies
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      - name: Build renderer/main
        run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.builder_args }} --publish never
      - name: Smoke (Linux)
        if: matrix.smoke == 'xvfb'
        run: xvfb-run -a npm run smoke
      - name: Smoke (macOS/Windows)
        if: matrix.smoke == 'gui'
        run: npm run smoke
      - name: Publish (draft)
        run: npx electron-builder ${{ matrix.builder_args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
