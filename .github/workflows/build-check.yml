name: build-check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # A transitive dep (@electron/node-gyp via electron-builder) is a GitHub git
      # dependency; force HTTPS so a runner with no SSH key can fetch it.
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # --foreground-scripts serialises install scripts (better-sqlite3's node-gyp
      # rebuild, electron's postinstall), working around npm's "Exit handler never
      # called!" race; dump the debug log if it still fails so the cause is visible.
      - run: npm ci --foreground-scripts || { echo '--- npm debug log ---'; cat "$HOME/.npm/_logs/"*-debug-0.log; exit 1; }
      - run: npm run typecheck
      - run: npm test
      # Build an unpacked app and smoke-test the native module under a virtual
      # display (Electron needs a display to reach app.whenReady on Linux).
      - run: npm run dist:dir
      - run: xvfb-run -a npm run smoke
