appId: net.mgm-tp.ai-sandbox-manager
productName: AI Sandbox Manager
copyright: © mgm technology partners
# We rebuild the native module ourselves (electron-rebuild, via the predist hook
# locally and an explicit step in CI) so it is deterministically built for the
# runner's own arch + Electron ABI. electron-builder's own auto-rebuild proved
# non-deterministic across its package/publish invocations and shipped an x86_64
# better-sqlite3 inside the arm64 build — so disable it and package what we built.
npmRebuild: false
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# better-sqlite3 is a native module: its .node must sit on disk, not inside asar.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
mac:
  # No arch here on purpose: each CI job selects one arch via the electron-builder
  # CLI (--arm64 on the arm64 runner, --x64 on the Intel runner), and local builds
  # target the host arch. Hardcoding [arm64, x64] made the arm64 runner build BOTH
  # bundles, and with npmRebuild:false the single host-arch better-sqlite3 landed in
  # the x64 bundle too (arch mismatch). One arch per runner keeps the module correct.
  target: [dmg]
  category: public.app-category.developer-tools
  icon: build/icon.png
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development
  icon: build/icon.png
  # Pin the executable name so the unpacked binary is dist/linux-unpacked/ai-sandbox-manager
  # (default would be the spaced productName), matching scripts/smoke.mjs.
  executableName: ai-sandbox-manager
